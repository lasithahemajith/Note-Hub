name: NoteHub CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/notehub

jobs:
  # ── Install & Lint ──────────────────────────────────────────────────────────
  lint:
    name: Install & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [auth-service, notes-service, api-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

  # ── Build & Push Docker Images ───────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-auth:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push notes-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/notes-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-notes:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./services/api-gateway
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-gateway:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.tag }}
          build-args: |
            REACT_APP_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy with Helm ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy with Helm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "v3.12.3"

      - name: Configure Kubernetes context
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create namespace
        run: kubectl create namespace notehub --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy via Helm
        run: |
          helm upgrade --install notehub ./infra/helm/notehub \
            --namespace notehub \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/notehub \
            --set image.tag=latest \
            --set jwt.secret=${{ secrets.JWT_SECRET }} \
            --set database.password=${{ secrets.DB_PASSWORD }} \
            --set database.rootPassword=${{ secrets.MYSQL_ROOT_PASSWORD }} \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/auth-service -n notehub
          kubectl rollout status deployment/notes-service -n notehub
          kubectl rollout status deployment/api-gateway -n notehub
          kubectl rollout status deployment/frontend -n notehub
