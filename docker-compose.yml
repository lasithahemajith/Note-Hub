version: "3.9"

# ── Shared environment ───────────────────────────────────────────────────────
x-common-env: &common-env
  JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: notehub
  DB_PASSWORD: ${DB_PASSWORD:-notehub_pass}
  DB_NAME: notehub
  LOG_LEVEL: info

services:

  # ── MySQL ──────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: notehub
      MYSQL_USER: notehub
      MYSQL_PASSWORD: ${DB_PASSWORD:-notehub_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "notehub", "-pnotehub_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notehub-net

  # ── Auth Service ───────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "3001"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - notehub-net

  # ── Notes Service ──────────────────────────────────────────────────────────
  notes-service:
    build:
      context: ./services/notes-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "3002"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3002:3002"
    networks:
      - notehub-net

  # ── API Gateway ────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: "3000"
      AUTH_SERVICE_URL: http://auth-service:3001
      NOTES_SERVICE_URL: http://notes-service:3002
    depends_on:
      - auth-service
      - notes-service
    ports:
      - "3000:3000"
    networks:
      - notehub-net

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "80:80"
    networks:
      - notehub-net

volumes:
  mysql_data:

networks:
  notehub-net:
    driver: bridge
