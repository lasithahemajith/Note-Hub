apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: auth-service
    {{- include "notehub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.authService }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: "{{ .Values.image.repository }}/notehub-auth:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.authService.port }}
          env:
            - name: PORT
              value: {{ .Values.service.authService.port | quote }}
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: notehub-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: notehub-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: notehub-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: notehub-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notehub-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: notehub-secret
                  key: JWT_SECRET
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: notehub-config
                  key: LOG_LEVEL
          resources:
            {{- toYaml .Values.resources.authService | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.authService.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.service.authService.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
