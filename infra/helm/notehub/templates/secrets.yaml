apiVersion: v1
kind: Secret
metadata:
  name: notehub-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notehub.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.jwt.secret | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.database.rootPassword | quote }}
