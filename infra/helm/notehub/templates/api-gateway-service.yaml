apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-gateway
    {{- include "notehub.labels" . | nindent 4 }}
spec:
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.service.apiGateway.port }}
      targetPort: {{ .Values.service.apiGateway.port }}
  type: {{ .Values.service.apiGateway.type }}
